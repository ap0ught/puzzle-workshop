name: Deploy Puzzle Workshop to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Same command Vercel runs for its build: if this fails, the Vercel
      # deployment of this commit is broken, so Pages stays undeployed too.
      - run: npm run build
      # vercel.json and vite.config.ts must agree on where the static site
      # lands, or Vercel silently serves the wrong (or empty) directory.
      - name: Check Vercel output directory matches Vite outDir
        run: node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('vercel.json','utf8'));const m=fs.readFileSync('vite.config.ts','utf8').match(/outDir:\s*'([^']+)'/);if(!m)throw new Error('outDir not found in vite.config.ts');if(v.outputDirectory!==m[1])throw new Error('vercel.json outputDirectory ('+v.outputDirectory+') does not match vite outDir ('+m[1]+')');"
  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  # Deploy the room Worker alongside the site. Stays skipped until the
  # repository variable ROOMS_WORKER_DEPLOY is set to "true" and a
  # CLOUDFLARE_API_TOKEN secret exists.
  deploy-worker:
    if: ${{ vars.ROOMS_WORKER_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy room Worker
        run: npx wrangler deploy --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
